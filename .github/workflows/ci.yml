name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      # Сборка ролика целиком на заглушках: без ключей, без обращений к платным API.
      - name: Dry-run build
        env:
          DATA_DIR: ${{ runner.temp }}/data
        run: |
          python -m factory run --limit 1 --dry-run
          test -s "$DATA_DIR/video_0001/final.mp4"
